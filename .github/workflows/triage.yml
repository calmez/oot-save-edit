name: Label new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    name: Mark for triage
    runs-on: ubuntu-latest
    steps:
      - name: Add needs-triage label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api --method POST "repos/$GH_REPO/issues/$ISSUE_NUMBER/labels" -f 'labels[]=needs-triage'
